[package]
name = "embedded-graphics-readback"
description = "A ReadbackTarget extension trait for embedded-graphics — read pixels back from buffered draw targets. no_std."
documentation = "https://docs.rs/embedded-graphics-readback"
version = "0.1.0"
authors = ["Jose Narvaez <goyox86@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goyox86/embedded-graphics-readback"
homepage = "https://github.com/goyox86/embedded-graphics-readback"
keywords = ["embedded-graphics", "graphics", "embedded", "no-std"]
categories = ["embedded", "no-std"]

[dependencies]
embedded-graphics-core = "0.4"

[dev-dependencies]
embedded-graphics = "0.8"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
needless_pass_by_value = "warn"

[package.metadata.docs.rs]
all-features = true
